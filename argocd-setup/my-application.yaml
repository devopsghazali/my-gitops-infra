apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-nginx-gitops-app
  namespace: argocd
spec:
  project: my-custom-project
  source:
    repoURL: 'https://github.com/devopsghazali/my-gitops-infra.git'
    targetRevision: HEAD
    path: k8s-configs
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
